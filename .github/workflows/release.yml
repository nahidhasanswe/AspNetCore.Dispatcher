name: Release

on:
  push:
    tags:
      - 'v*'
  # A manual run is a rehearsal: it builds, tests, packs and performs the real OIDC
  # exchange, but skips the tag-only steps that publish.
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  id-token: write   # request the GitHub OIDC token for trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Verify the tag matches the project version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          prefix=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' src/AspNetCore.Dispatcher/AspNetCore.Dispatcher.csproj)
          suffix=$(grep -oPm1 '(?<=<VersionSuffix>)[^<]*' src/AspNetCore.Dispatcher/AspNetCore.Dispatcher.csproj || true)

          if [ -n "$suffix" ]; then
            project="$prefix-$suffix"
          else
            project="$prefix"
          fi

          echo "tag=$tag project=$project"

          if [ "$tag" != "$project" ]; then
            echo "::error::Tag $tag does not match the project version $project. Update the csproj or retag."
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/AspNetCore.Dispatcher/AspNetCore.Dispatcher.csproj --configuration Release --no-build --output ./artifacts

      # Trusted Publishing: exchange the job's OIDC token for a temporary nuget.org API
      # key. The key lasts one hour and each token buys exactly one key, so this step
      # stays immediately before the push. Not gated on the tag, so a manual run still
      # proves the policy works. Requires a trusted publishing policy on nuget.org; see
      # PUBLISHING.md.
      - name: Authenticate to nuget.org (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.*nupkg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Install:

            ```
            dotnet add package AspNetCore.Dispatcher --version ${{ steps.version.outputs.version }}
            ```

            See [CHANGELOG.md](https://github.com/nahidhasanswe/AspNetCore.Dispatcher/blob/main/CHANGELOG.md) for what changed.
